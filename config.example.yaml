# ReadLens 配置示例。复制为 config.yaml 后按需修改。

# 使用的阅读平台适配器：weread | mock
# mock = 内置离线示例数据，无需 API Key，适合体验和开发
platform: mock

weread:
  # 网关地址（一般无需修改）
  base_url: https://weread.qq.com/r/weread-skills
  # API Key 也可通过环境变量 WEREAD_API_KEY 提供（环境变量优先）
  api_key: null
  skill_version: "1.0.3"

ai:
  # LLM 引擎：offline（离线模板，默认） | openai
  engine: offline
  model: gpt-4o-mini
  # 温度等参数
  temperature: 0.4

export:
  # 默认导出目录
  out_dir: ./export_output
  # Obsidian vault 路径（obsidian 导出时使用）
  obsidian_vault: null

report:
  out_dir: ./report_output
  # 图表主题色
  theme_color: "#07c160"
