[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readlens"
version = "0.3.0"
description = "读透 ReadLens — 阅读智能工具箱：多平台阅读数据的导出、报告、AI 分析与 Obsidian 知识库生成（脱胎于 Tencent/WeChatReading Skills）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ReadLens Contributors" }]
keywords = ["reading", "obsidian", "dataview", "weread", "微信读书", "knowledge-base", "notes", "读书笔记"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/zjsthmjialin/readlens"
Repository = "https://github.com/zjsthmjialin/readlens"
Issues = "https://github.com/zjsthmjialin/readlens/issues"

[project.scripts]
readlens = "readlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["readlens*"]
