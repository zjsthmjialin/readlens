name: Publish to PyPI

# 推送形如 v0.2.0 的标签时触发：自动构建并用 Trusted Publishing 发到 PyPI。
# 无需在仓库里存任何 Token —— 通过 OIDC 让 PyPI 信任本仓库的这个工作流。
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # 与 PyPI Trusted Publisher 配置里的 environment 名一致
    permissions:
      id-token: write          # OIDC 发布必需
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
